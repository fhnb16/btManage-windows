name: Build

# Every push and pull request builds the application and keeps the result as artifacts.
# Pushes to main/master publish a release using the project version, with a numeric suffix
# when that version has already been used. Pushing a "v1.2.3" tag also publishes a release.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Branch, tag or commit of btManage-core to build against (default branch if empty)
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    name: Prepare version
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: btManage-windows

      - name: Choose and reserve the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]]; then
            base_version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' btManage-windows/src/BtManage/BtManage.csproj | head -n 1)"
            if [[ -z "$base_version" ]]; then
              echo "::error::Could not read the base version from BtManage.csproj."
              exit 1
            fi

            tags="$(gh api --paginate "repos/$GH_REPO/tags?per_page=100" --jq '.[].name')"
            suffix=0
            while :; do
              if (( suffix == 0 )); then
                version="$base_version"
              else
                version="$base_version.$suffix"
              fi
              tag="v$version"

              if grep -Fqx "$tag" <<< "$tags"; then
                suffix=$((suffix + 1))
                continue
              fi

              if output="$(gh api --method POST "repos/$GH_REPO/git/refs" \
                -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" 2>&1)"; then
                break
              elif [[ "$output" == *"Reference already exists"* ]]; then
                tags+=$'\n'"$tag"
                suffix=$((suffix + 1))
              else
                echo "$output" >&2
                exit 1
              fi
            done
          else
            version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "::error::Release version '$version' must contain three or four numeric components."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Windows ${{ matrix.arch }}
    # btManage-core is private. Pull requests from forks do not get its token, so they are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            rid: win-x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            platform: ARM64
            rid: win-arm64
            rust_target: aarch64-pc-windows-msvc
    env:
      HAS_CORE_TOKEN: ${{ secrets.CORE_REPO_TOKEN != '' }}
      NAME: btManage-windows-${{ matrix.arch }}
    steps:
      - name: Require the core token
        if: env.HAS_CORE_TOKEN != 'true'
        shell: bash
        run: |
          echo "::error::Secret CORE_REPO_TOKEN is not set. Add a fine-grained token with read access to the contents of btManage-core (Settings, Secrets and variables, Actions)."
          exit 1

      # The two repositories sit side by side, as on a developer machine.
      - uses: actions/checkout@v7
        with:
          path: btManage-windows

      - name: Check out the core
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/btManage-core
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: btManage-core

      - name: Work out the version
        id: version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, built against btManage-core \`$(git -C btManage-core rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: btManage-core
          key: ${{ matrix.rust_target }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Builds the Rust core too: see build/RustCore.targets.
      - name: Publish the application folder
        run: >
          dotnet publish btManage-windows/src/BtManage/BtManage.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.version }}
          -p:UpdateRepository=${{ github.repository }}
          -o publish/folder

      - name: Publish the single executable
        run: >
          dotnet publish btManage-windows/src/BtManage/BtManage.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.version }}
          -p:UpdateRepository=${{ github.repository }}
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/single

      # The names are part of the contract with the updater: it looks for
      # "windows-<arch>.zip" or "windows-<arch>-portable.exe" among the release files.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Remove-Item publish/folder/*.pdb, publish/single/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/folder/* -DestinationPath "dist/$env:NAME.zip"
          7z a -t7z -mx=9 "dist/$env:NAME.7z" ./publish/folder/* | Select-Object -Last 2
          Copy-Item publish/single/BtManage.exe "dist/$env:NAME-portable.exe"

      # Not tried on a runner yet, so a failure here does not hold back the other files.
      - name: Build the installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -Last 1 -ExpandProperty FullName
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DArch=${{ matrix.arch }}" `
            "/DSourceDir=$PWD\publish\folder" "/DOutputDir=$PWD\dist" btManage-windows\installer\btManage.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: btManage-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
